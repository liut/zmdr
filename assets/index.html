<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zmdr</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
  <style id="markdown-styles">
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --border-color: #d0d7de;
      --code-bg: #f6f8fa;
      --link-color: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --border-color: #30363d;
        --code-bg: #161b22;
        --link-color: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-primary);
      display: flex;
    }
    .sidebar {
      width: 250px;
      min-width: 250px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 16px 0;
      font-size: 14px;
    }
    .sidebar-title {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      padding: 8px 16px;
      margin: 0;
    }
    .sidebar ul { list-style: none; margin: 0; padding: 0; }
    .sidebar li a {
      display: block;
      padding: 4px 16px;
      color: var(--text-primary);
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar li a:hover { background: var(--bg-primary); }
    .sidebar li a.active { background: var(--bg-secondary); border-left-color: var(--link-color); color: var(--link-color); }
    .sidebar li.toc-h2 a { padding-left: 24px; }
    .sidebar li.toc-h3 a { padding-left: 36px; font-size: 13px; }
    .content {
      margin-left: 250px;
      max-width: 900px;
      padding: 32px 24px;
      flex: 1;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3em;
    }
    .markdown-body h1 { font-size: 2em; margin-top: 0; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body p { margin-top: 0; margin-bottom: 16px; }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 85%;
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 6px;
    }
    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.45;
    }
    .markdown-body pre code { background: transparent; padding: 0; font-size: 85%; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 6px 13px; }
    .markdown-body th { font-weight: 600; background: var(--code-bg); }
    .markdown-body blockquote {
      color: var(--text-secondary);
      border-left: 4px solid var(--border-color);
      padding: 0 16px;
      margin: 16px 0;
    }
    .markdown-body a { color: var(--link-color); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .ext-link { color: var(--link-color); text-decoration: none; cursor: pointer; }
    .ext-link:hover { text-decoration: underline; }
    .markdown-body hr { border: none; border-top: 1px solid var(--border-color); margin: 24px 0; }
    .markdown-body img { max-width: 100%; }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; margin-bottom: 16px; }
    .markdown-body input[type="checkbox"] { margin-right: 0.5em; }
    .mermaid-diagram { text-align: center; margin: 16px 0; }
    .mermaid-diagram svg { max-width: 100%; height: auto; }
    @media (prefers-color-scheme: dark) {
      .mermaid-diagram svg { background: #161b22; }
    }
    .mermaid-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
    }
    @media (prefers-color-scheme: dark) {
      .mermaid-error { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    }
    .math-block { text-align: center; margin: 16px 0; overflow-x: auto; }
    .math-block .katex { font-size: 1.1em; }
    @media (prefers-color-scheme: dark) {
      .math-block .katex { color: #e6edf3; }
    }
    .math-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
    }
    @media (prefers-color-scheme: dark) {
      .math-error { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    }

    .search-bar {
      position: fixed;
      bottom: 0;
      left: 250px;
      right: 0;
      background: var(--code-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      font-size: 14px;
    }
    .search-bar input {
      flex: 1;
      max-width: 400px;
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--link-color); }
    .search-bar .search-info { color: var(--text-secondary); white-space: nowrap; }
    .search-bar button {
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--code-bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
    }
    .search-bar button:hover { background: var(--bg-secondary); }
    .search-bar .close-btn { margin-left: auto; }
    mark.search-highlight { background: #ffd33d55; color: inherit; border-radius: 2px; }
    mark.search-highlight.current { background: #ffd33d; color: #000; }
  </style>
</head>
<body>
  <nav class="sidebar" id="toc">
    <p class="sidebar-title">Table of Contents</p>
    <ul></ul>
  </nav>
  <div class="content">
    <div id="content" class="markdown-body"></div>
    </div>
  <div class="search-bar" id="searchBar" style="display:none;">
    <input type="text" id="searchInput" placeholder="Search..." />
    <span class="search-info" id="searchInfo">0/0</span>
    <button onclick="searchNav(-1)">▲</button>
    <button onclick="searchNav(1)">▼</button>
    <button class="close-btn" onclick="closeSearch()">Esc</button>
  </div>
  <input type="file" id="fileInput" accept=".md,.markdown" style="display:none" />

  <script>
    // Global state
    let currentMarkdown = '';
    let matches = [];
    let currentIdx = -1;

    // Configure marked: render external links as clickable spans to bypass WKWebView link handling
    marked.use({
      gfm: true,
      breaks: true,
      renderer: {
        link: function(obj) {
          if (obj.href.startsWith('http://') || obj.href.startsWith('https://')) {
            return '<span class="ext-link" data-href="' +
              obj.href.replace(/"/g, '&quot;') + '">' + obj.text + '</span>';
          }
          return false;
        }
      }
    });
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang === 'mermaid') return code;
        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
        return hljs.highlightAuto(code).value;
      }
    });

    // Configure mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
      securityLevel: 'loose',
      fontFamily: 'system-ui'
    });

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      mermaid.initialize({
        theme: e.matches ? 'dark' : 'default'
      });
      renderMermaid();
    });


    // Math formula rendering (KaTeX)
    // Block-level extension: $$...$$ display math
    const mathBlock = {
      name: 'mathBlock',
      level: 'block',
      start(src) { return src.match(/\$\$/)?.index; },
      tokenizer(src) {
        const rule = /^\$\$\s*\n?([\s\S]*?)\n?\s*\$\$/;
        const match = rule.exec(src);
        if (match) {
          return { type: 'mathBlock', raw: match[0], text: match[1].trim() };
        }
      },
      renderer(token) {
        if (typeof katex === 'undefined') {
          return '<div class="math-error">KaTeX not loaded</div>';
        }
        if (!token.text) {
          return '<div class="math-block"></div>';
        }
        // Strip unsupported commands
        const sanitized = token.text.replace(/\\label\{[^}]*\}/g, '');
        try {
          const html = katex.renderToString(sanitized, { displayMode: true, throwOnError: false, strict: false });
          return '<div class="math-block">' + html + '</div>';
        } catch (e) {
          return '<div class="math-error">Formula error: ' + e.message + '</div>';
        }
      }
    };

    // Inline-level extension: $...$ inline math
    const mathInline = {
      name: 'mathInline',
      level: 'inline',
      start(src) { return src.indexOf('$'); },
      tokenizer(src) {
        // Match formulas containing LaTeX commands (has \), regardless of $ prefix
        let rule = /^\$(?=[^$\n]*\\)([^$\n]+?)\$/;
        let match = rule.exec(src);
        // Match formulas where $ not followed by currency pattern (digits + space/punct/end)
        if (!match) {
          rule = /^\$(?!\d+(?:\s|[.,;:!?]|$))([^$\n]+?)\$/;
          match = rule.exec(src);
        }
        if (match) {
          return { type: 'mathInline', raw: match[0], text: match[1].trim() };
        }
      },
      renderer(token) {
        if (typeof katex === 'undefined') {
          return token.raw;
        }
        try {
          const html = katex.renderToString(token.text, { displayMode: false, throwOnError: false, strict: false });
          return '<span class="math-inline">' + html + '</span>';
        } catch (e) {
          return token.raw;
        }
      }
    };

    // Register both math extensions
    marked.use({ extensions: [mathBlock, mathInline] });

    // Update content from Zig (initial load)
    window.zigUpdateContent = function(markdown) {
      currentMarkdown = markdown;
      document.getElementById('content').innerHTML = marked.parse(currentMarkdown);
      // Highlight code blocks (except mermaid)
      document.querySelectorAll('pre code:not(.language-mermaid)').forEach(block => {
        hljs.highlightElement(block);
      });
      renderMermaid();
      buildToc();
      bindExtLinks();
    };

    // Reload content from Zig (file watch - preserves scroll position via anchor)
    window.zigReloadMarkdown = function(markdown) {
      if (markdown === currentMarkdown) return; // No change
      const contentEl = document.getElementById('content');
      currentMarkdown = markdown;

      // Find current visible heading as anchor
      var headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
      var anchorId = null;
      headings.forEach(function(h) {
        if (h.getBoundingClientRect().top < window.innerHeight / 2) {
          anchorId = h.id || null;
        }
      });

      // Full update with innerHTML
      contentEl.innerHTML = marked.parse(currentMarkdown);

      // Restore scroll to anchor
      if (anchorId) {
        var anchorEl = document.getElementById(anchorId);
        if (anchorEl) anchorEl.scrollIntoView({ behavior: 'instant', block: 'start' });
      }

      // Re-highlight code blocks
      contentEl.querySelectorAll('pre code:not(.language-mermaid)').forEach(function(block) {
        hljs.highlightElement(block);
      });
      // Re-render mermaid diagrams
      renderMermaid();
      // Rebuild TOC
      buildToc();
      bindExtLinks();
    };

    function bindExtLinks() {
      document.querySelectorAll('#content .ext-link').forEach(function(el) {
        if (el.dataset.bound) return;
        el.dataset.bound = '1';
        el.addEventListener('click', function() {
          window.openExternal(JSON.stringify(el.getAttribute('data-href')));
        });
      });
    }

    // Handle anchor links via event delegation
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || !href.startsWith('#')) return;
      e.preventDefault();
      var el = document.getElementById(href.substring(1));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    async function renderMermaid() {
      // Find code blocks with language-mermaid
      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
      for (const block of mermaidBlocks) {
        const code = block.textContent.trim();
        if (!code) continue;
        const pre = block.parentElement;
        try {
          const id = 'mermaid-' + Date.now() + Math.random().toString(36).substr(2, 6);
          const { svg } = await mermaid.render(id, code);
          pre.innerHTML = '<div class="mermaid-diagram">' + svg + '</div>';
        } catch (e) {
          pre.innerHTML = '<div class="mermaid-error">Diagram error: ' + e.message + '</div>';
        }
      }
    }

    function buildToc() {
      const heads = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
      const tocList = document.querySelector('#toc ul');
      if (!heads.length) {
        tocList.innerHTML = '';
        return;
      }

      const items = [];
      heads.forEach((h, i) => {
        if (!h.id) h.id = 'heading-' + i;
        const level = parseInt(h.tagName.charAt(1));
        items.push('<li class="toc-h' + level + '"><a href="#' + h.id + '">' + h.textContent + '</a></li>');
      });
      tocList.innerHTML = items.join('');

      // TOC click handler
      tocList.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          const id = a.getAttribute('href').substring(1);
          const el = document.getElementById(id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            tocList.querySelectorAll('a').forEach(a => a.classList.remove('active'));
            a.classList.add('active');
          }
        });
      });
    }

    // Search functionality
    function clearHighlights() {
      document.querySelectorAll('mark.search-highlight').forEach(m => {
        const parent = m.parentNode;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
      });
      matches = [];
      currentIdx = -1;
    }

    function highlightMatches(query) {
      clearHighlights();
      if (!query) { updateInfo(); return; }
      var walker = document.createTreeWalker(
        document.getElementById('content'),
        NodeFilter.SHOW_TEXT, null, false
      );
      var textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      var queryLower = query.toLowerCase();
      for (var i = textNodes.length - 1; i >= 0; i--) {
        var node = textNodes[i];
        var text = node.textContent;
        var textLower = text.toLowerCase();
        var idx = textLower.lastIndexOf(queryLower);
        while (idx >= 0) {
          var range = document.createRange();
          range.setStart(node, idx);
          range.setEnd(node, idx + query.length);
          var mark = document.createElement('mark');
          mark.className = 'search-highlight';
          range.surroundContents(mark);
          node = mark.previousSibling || node.parentNode.firstChild;
          idx = idx > 0 ? node.textContent.toLowerCase().lastIndexOf(queryLower, idx - 1) : -1;
        }
      }
      matches = document.querySelectorAll('mark.search-highlight');
      if (matches.length > 0) { currentIdx = 0; goToCurrent(); }
      updateInfo();
    }

    function goToCurrent() {
      document.querySelectorAll('mark.search-highlight.current').forEach(m => m.classList.remove('current'));
      if (matches.length > 0 && currentIdx >= 0) {
        matches[currentIdx].classList.add('current');
        matches[currentIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateInfo();
    }

    function updateInfo() {
      var info = document.getElementById('searchInfo');
      if (matches.length === 0) info.textContent = '0/0';
      else info.textContent = (currentIdx + 1) + '/' + matches.length;
    }

    window.searchNav = function(dir) {
      if (matches.length === 0) return;
      currentIdx = (currentIdx + dir + matches.length) % matches.length;
      goToCurrent();
    };

    window.closeSearch = function() {
      document.getElementById('searchBar').style.display = 'none';
      clearHighlights();
      updateInfo();
    };

    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        var bar = document.getElementById('searchBar');
        bar.style.display = 'flex';
        var input = document.getElementById('searchInput');
        input.focus();
        input.select();
      }
      if (e.key === 'Escape') {
        window.closeSearch();
      }
      if (e.key === 'Enter' && document.activeElement === document.getElementById('searchInput')) {
        e.preventDefault();
        if (e.shiftKey) window.searchNav(-1);
        else window.searchNav(1);
      }
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      highlightMatches(this.value);
    });

    // Allow context menu only when text is selected (for Copy), block otherwise
    document.addEventListener('contextmenu', function(e) {
      var sel = window.getSelection();
      if (!sel || !sel.toString()) {
        e.preventDefault();
      }
    });


    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'w') {
        e.preventDefault();
        window.closeWindow();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
        e.preventDefault();
        document.getElementById('fileInput').click();
      }
      // Cmd+C / Ctrl+C: copy current selection
      if ((e.metaKey || e.ctrlKey) && e.key === 'c') {
        var sel = window.getSelection();
        if (sel && sel.toString() && !e.target.closest('input, textarea')) {
          document.execCommand('copy');
        }
      }
    });

    // File open handler
    document.getElementById('fileInput').addEventListener('change', function() {
      var file = this.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var content = ev.target.result;
        window.zigUpdateContent(content);
        document.title = file.name;
        window.zigSetTitle && window.zigSetTitle(file.name);
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
